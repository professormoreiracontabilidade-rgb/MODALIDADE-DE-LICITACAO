<script>
const telas = [
['Art. 28 — caput','Art. 28. São modalidades de licitação:','A Lei nº 14.133/2021 apresenta uma lista fechada das modalidades licitatórias. Modalidade é o formato jurídico do procedimento, escolhido principalmente em razão da natureza do objeto, e não simplesmente pelo valor da contratação. A nova lei abandonou a tomada de preços e o convite e incorporou o diálogo competitivo.\n\nAtenção: modalidade não se confunde com critério de julgamento. Pregão, concorrência, concurso, leilão e diálogo competitivo são modalidades; menor preço, maior desconto, melhor técnica, técnica e preço, maior lance e maior retorno econômico são critérios de julgamento.'],
['Art. 28, inciso I','I - pregão;','O pregão é obrigatório quando o objeto puder ser descrito por padrões de desempenho e qualidade objetivamente definidos no edital, mediante especificações usuais de mercado. É a modalidade típica para aquisição de bens e contratação de serviços comuns, inclusive serviços comuns de engenharia.\n\nA palavra decisiva é “comum”: não significa simples ou barato, mas padronizável e comparável objetivamente. Em regra, o pregão utiliza menor preço ou maior desconto e segue o rito comum do art. 17, com julgamento antes da habilitação.'],
['Art. 28, inciso II','II - concorrência;','A concorrência é utilizada para contratação de bens e serviços especiais e para obras e serviços de engenharia, comuns ou especiais, ressalvada a incidência obrigatória do pregão nos serviços comuns de engenharia. Também pode ser empregada nas hipóteses legais de alienação de bens imóveis.\n\nEla segue o rito procedimental comum. Na prova, evite associar concorrência apenas a contratações de alto valor: na Lei nº 14.133/2021, o valor deixou de ser o elemento central para escolher entre pregão e concorrência; prevalecem as características do objeto.'],
['Art. 28, inciso III','III - concurso;','Concurso é a modalidade destinada à escolha de trabalho técnico, científico ou artístico, mediante prêmio ou remuneração ao vencedor. Não é concurso público para contratação de servidores. Aqui, a Administração procura selecionar um trabalho, projeto ou criação conforme regras previamente estabelecidas no edital.\n\nO critério está ligado à melhor técnica ou ao melhor conteúdo artístico. O prêmio ou a remuneração e as condições de cessão dos direitos patrimoniais devem ser disciplinados no edital.'],
['Art. 28, inciso IV','IV - leilão;','Leilão é a modalidade voltada à alienação de bens imóveis ou de bens móveis inservíveis ou legalmente apreendidos, adjudicando-se o objeto a quem oferecer o maior lance. A lógica é inversa à compra pública: a Administração não busca pagar menos, mas obter a melhor oferta pela venda do bem.\n\nNão há fase de habilitação nem registro cadastral prévio. A publicidade do edital, a descrição clara do bem, o preço mínimo e eventuais ônus protegem a competição e o futuro adquirente.'],
['Art. 28, inciso V','V - diálogo competitivo.','O diálogo competitivo atende contratações complexas nas quais a Administração ainda não consegue definir, sozinha e com precisão suficiente, a solução técnica, jurídica ou financeira. Primeiro ocorre diálogo com licitantes pré-selecionados; depois de identificada a solução adequada, abre-se a fase competitiva para apresentação das propostas finais.\n\nNão é uma conversa informal nem liberdade para favorecer empresas. Há edital, critérios objetivos, igualdade, confidencialidade, registros e comissão de contratação. É modalidade excepcional, limitada às hipóteses do art. 32.'],
['Art. 28, § 1º','§ 1º Além das modalidades referidas no caput deste artigo, a Administração pode servir-se dos procedimentos auxiliares previstos no art. 78 desta Lei.','Os procedimentos auxiliares apoiam as licitações e contratações, mas não são novas modalidades. O art. 78 prevê credenciamento, pré-qualificação, procedimento de manifestação de interesse, sistema de registro de preços e registro cadastral.\n\nPegadinha clássica: credenciamento e sistema de registro de preços não são modalidades licitatórias. Eles são instrumentos auxiliares que podem preparar, organizar ou viabilizar futuras contratações conforme a disciplina legal.'],
['Art. 28, § 2º','§ 2º É vedada a criação de outras modalidades de licitação ou, ainda, a combinação daquelas referidas no caput deste artigo.','A lista do art. 28 é taxativa. O administrador não pode inventar uma modalidade, misturar partes de duas modalidades para criar uma modalidade híbrida nem ressuscitar modalidades não previstas na nova lei. Isso preserva legalidade, previsibilidade e igualdade entre licitantes.\n\nA vedação não impede que a lei discipline procedimentos, modos de disputa ou critérios de julgamento. O que não pode ocorrer é a autoridade administrativa criar, por edital ou regulamento, uma sexta modalidade.'],
['Art. 29 — regra geral','Art. 29. A concorrência e o pregão seguem o rito procedimental comum a que se refere o art. 17 desta Lei, adotando-se o pregão sempre que o objeto possuir padrões de desempenho e qualidade que possam ser objetivamente definidos pelo edital, por meio de especificações usuais de mercado.','Concorrência e pregão compartilham o rito comum: fase preparatória, divulgação do edital, apresentação de propostas e lances, julgamento, habilitação, fase recursal e homologação. A habilitação pode, excepcionalmente e mediante justificativa, anteceder propostas e julgamento, se isso estiver expressamente previsto no edital.\n\nO pregão deve ser adotado quando o objeto for comum e puder ser objetivamente especificado. Portanto, atendidos esses requisitos, a Administração não possui liberdade para escolher a concorrência apenas por preferência pessoal.'],
['Art. 29, parágrafo único','Parágrafo único. O pregão não se aplica às contratações de serviços técnicos especializados de natureza predominantemente intelectual e de obras e serviços de engenharia, exceto os serviços de engenharia de que trata a alínea “a” do inciso XXI do caput do art. 6º desta Lei.','O pregão é afastado para serviços técnicos especializados predominantemente intelectuais e para obras de engenharia. A exceção são os serviços comuns de engenharia: atividades cujas ações são objetivamente padronizáveis em manutenção, adequação e adaptação, preservadas as características originais dos bens.\n\nAssim: obra de engenharia não vai para pregão; serviço especial de engenharia também não; serviço comum de engenharia pode e, sendo comum, deve ser licitado por pregão. Essa distinção é muito cobrada.'],
['Art. 30 — caput','Art. 30. O concurso observará as regras e condições previstas em edital, que indicará:','No concurso, o edital é a lei interna do certame e precisa estabelecer previamente como o trabalho será avaliado, quem poderá participar, como será apresentado e qual será a recompensa. Isso assegura julgamento transparente e comparável.\n\nA modalidade busca uma produção técnica, científica ou artística. Não se confunde com seleção de pessoal nem com competição de preços para fornecimento rotineiro.'],
['Art. 30, inciso I','I - a qualificação exigida dos participantes;','O edital deve informar a formação, experiência, habilitação profissional ou outras qualificações indispensáveis à elaboração do trabalho. As exigências precisam guardar relação com o objeto e não podem restringir indevidamente a competição.\n\nA Administração não pode criar requisitos excessivos ou irrelevantes. A qualificação serve para garantir aptidão, e não para direcionar o certame a participante específico.'],
['Art. 30, inciso II','II - as diretrizes e formas de apresentação do trabalho;','O edital deve explicar o conteúdo esperado, os parâmetros técnicos, o formato, o prazo, a identificação ou anonimato e os meios de entrega. Diretrizes claras reduzem subjetividade e permitem julgamento isonômico.\n\nEm uma prova, associe este inciso à previsibilidade do julgamento: todos devem conhecer antecipadamente as regras que orientarão a elaboração e avaliação dos trabalhos.'],
['Art. 30, inciso III','III - as condições de realização e o prêmio ou remuneração a ser concedida ao vencedor.','O edital deve tornar públicas as condições do concurso e a vantagem destinada ao vencedor. Essa vantagem pode assumir a forma de prêmio ou remuneração, conforme a natureza da seleção.\n\nO pagamento não transforma o concurso em contratação automática de qualquer serviço futuro. Os efeitos da vitória, a utilização do trabalho e os direitos patrimoniais devem obedecer ao edital e à lei.'],
['Art. 30, parágrafo único','Parágrafo único. Nos concursos destinados à elaboração de projeto, o vencedor deverá ceder à Administração Pública, nos termos do art. 93 desta Lei, todos os direitos patrimoniais relativos ao projeto e autorizar sua execução conforme juízo de conveniência e oportunidade das autoridades competentes.','Quando o concurso produz um projeto, a Administração precisa ter condições jurídicas de utilizá-lo. Por isso, o vencedor cede os direitos patrimoniais, permitindo reprodução, adaptação e execução nos termos legais. Os direitos morais do autor, quando aplicáveis, não se confundem com os patrimoniais.\n\nA vitória também não obriga a Administração a executar imediatamente o projeto. A execução dependerá do juízo administrativo de conveniência e oportunidade, do planejamento e da disponibilidade de recursos.'],
['Art. 31 — caput','Art. 31. O leilão poderá ser cometido a leiloeiro oficial ou a servidor designado pela autoridade competente da Administração, e regulamento deverá dispor sobre seus procedimentos operacionais.','A condução do leilão pode ser atribuída a duas figuras: leiloeiro oficial ou servidor designado. A escolha deverá observar a lei e a regulamentação dos procedimentos operacionais.\n\nA palavra “poderá” indica que não existe obrigação de contratar leiloeiro oficial em todos os casos. Se houver servidor adequadamente designado, ele poderá conduzir o procedimento.'],
['Art. 31, § 1º','§ 1º Se optar pela realização de leilão por intermédio de leiloeiro oficial, a Administração deverá selecioná-lo mediante credenciamento ou licitação na modalidade pregão e adotar o critério de julgamento de maior desconto para as comissões a serem cobradas, utilizados como parâmetro máximo os percentuais definidos na lei que regula a referida profissão e observados os valores dos bens a serem leiloados.','Se a Administração escolher leiloeiro oficial, deverá selecioná-lo por credenciamento ou pregão. No pregão, o critério é o maior desconto incidente sobre as comissões, respeitando como teto os percentuais da legislação profissional e considerando os valores dos bens.\n\nPerceba a diferença: no leilão do bem, vence o maior lance; na seleção do leiloeiro por pregão, busca-se o maior desconto da comissão. A banca costuma trocar esses critérios.'],
['Art. 31, § 2º — caput','§ 2º O leilão será precedido da divulgação do edital em sítio eletrônico oficial, que conterá:','O edital deve ser divulgado antes do leilão em sítio eletrônico oficial. A publicidade amplia o acesso dos interessados, fortalece a competição e permite conhecer antecipadamente o estado, o valor e as condições de aquisição dos bens.\n\nOs incisos seguintes trazem conteúdo mínimo obrigatório. A omissão de informação relevante pode comprometer transparência, igualdade e segurança do negócio.'],
['Art. 31, § 2º, inciso I','I - a descrição do bem, com suas características, e, no caso de imóvel, sua situação e suas divisas, com remissão à matrícula e aos registros;','O interessado precisa identificar exatamente o que será adquirido. Para imóveis, a lei exige situação, limites e referência à matrícula e aos registros, permitindo verificar propriedade, dimensões e histórico registral.\n\nDescrição insuficiente prejudica a avaliação do lance e pode ocultar riscos. A publicidade deve ser materialmente útil, e não apenas formal.'],
['Art. 31, § 2º, inciso II','II - o valor pelo qual o bem foi avaliado, o preço mínimo pelo qual poderá ser alienado, as condições de pagamento e, se for o caso, a comissão do leiloeiro designado;','O edital revela a avaliação administrativa, o preço mínimo aceitável, a forma de pagamento e eventual comissão. Esses dados possibilitam que o licitante calcule o custo total e formule lance consciente.\n\nO maior lance não autoriza alienação abaixo do mínimo definido. A Administração deve proteger o patrimônio público e respeitar as condições divulgadas.'],
['Art. 31, § 2º, inciso III','III - a indicação do lugar onde estiverem os móveis, os veículos e os semoventes;','O edital deve dizer onde podem ser encontrados os bens móveis, veículos e semoventes, isto é, animais sujeitos à movimentação própria e economicamente considerados como bens. Isso facilita inspeção e avaliação pelos interessados.\n\nConhecer a localização pode influenciar custos de retirada, transporte e conservação, razão pela qual a informação integra a transparência econômica do leilão.'],
['Art. 31, § 2º, inciso IV','IV - o sítio da internet e o período em que ocorrerá o leilão, salvo se excepcionalmente for realizado sob a forma presencial por comprovada inviabilidade técnica ou desvantagem para a Administração, hipótese em que serão indicados o local, o dia e a hora de sua realização;','A regra é o leilão eletrônico, com indicação do endereço digital e do período de realização. O formato presencial é excepcional e exige comprovação de inviabilidade técnica ou de desvantagem para a Administração.\n\nNão basta alegar conveniência genericamente. A escolha presencial deve estar motivada; nesse caso, o edital informa local, dia e hora para preservar publicidade e participação.'],
['Art. 31, § 2º, inciso V','V - a especificação de eventuais ônus, gravames ou pendências existentes sobre os bens a serem leiloados.','Ônus, gravames e pendências podem reduzir o valor econômico ou impor deveres ao adquirente. Devem ser expostos com clareza para evitar surpresa e permitir que o lance reflita a situação real do bem.\n\nExemplos: restrições, débitos, ocupação, penhora ou outras limitações juridicamente relevantes. A omissão viola transparência e pode gerar litígio.'],
['Art. 31, § 3º','§ 3º Além da divulgação no sítio eletrônico oficial, o edital do leilão será afixado em local de ampla circulação de pessoas na sede da Administração e poderá, ainda, ser divulgado por outros meios necessários para ampliar a publicidade e a competitividade da licitação.','A publicação eletrônica é acompanhada de afixação física em local movimentado na sede administrativa. Outros meios de divulgação são facultados quando úteis para alcançar mais interessados e elevar a competição.\n\nObserve os verbos: o edital “será” afixado, obrigação; e “poderá” ser divulgado por outros meios, faculdade orientada à efetividade da publicidade.'],
['Art. 31, § 4º','§ 4º O leilão não exigirá registro cadastral prévio, não terá fase de habilitação e deverá ser homologado assim que concluída a fase de lances, superada a fase recursal e efetivado o pagamento pelo licitante vencedor, na forma definida no edital.','O procedimento do leilão é simplificado: não se exige cadastro anterior nem existe fase de habilitação. Após os lances, resolve-se eventual recurso e o vencedor efetua o pagamento conforme o edital; então ocorre a homologação.\n\nPegadinha: não se homologa imediatamente após o maior lance. A lei exige que a fase recursal seja superada e que o pagamento seja efetivado.'],
['Art. 32 — caput','Art. 32. A modalidade diálogo competitivo é restrita a contratações em que a Administração:','A expressão “é restrita” confirma o caráter excepcional do diálogo competitivo. Ele não pode ser usado apenas porque o gestor deseja negociar ideias com o mercado; deve existir uma das situações complexas descritas nos incisos.\n\nA Administração conhece sua necessidade, mas ainda precisa dialogar para estruturar a solução capaz de atendê-la. Depois disso, ocorre competição entre os pré-selecionados.'],
['Art. 32, inciso I — caput','I - vise a contratar objeto que envolva as seguintes condições:','Este inciso introduz condições relacionadas à complexidade ou à indefinição do objeto. As alíneas são ligadas pela conjunção “e” no texto legal, sendo apresentadas cumulativamente dentro desta hipótese.\n\nA modalidade não deve substituir o planejamento comum. Ela existe quando, apesar dos estudos, a Administração enfrenta inovação, necessidade de adaptação e impossibilidade de especificar com precisão suficiente.'],
['Art. 32, inciso I, alínea a','a) inovação tecnológica ou técnica;','A contratação envolve solução nova ou aplicação inovadora de tecnologia ou técnica. Como o mercado pode deter conhecimento que a Administração não possui integralmente, o diálogo ajuda a mapear alternativas viáveis.\n\nA mera compra de tecnologia disponível e padronizada não basta. Deve haver complexidade inovadora relevante para a definição do objeto.'],
['Art. 32, inciso I, alínea b','b) impossibilidade de o órgão ou entidade ter sua necessidade satisfeita sem a adaptação de soluções disponíveis no mercado; e','As soluções prontas existentes não atendem completamente à necessidade pública. Será preciso adaptá-las, combiná-las ou desenvolver ajustes, o que torna prematura uma especificação fechada desde o início.\n\nO diálogo permite compreender como o mercado pode realizar essa adaptação sem que a Administração favoreça participante específico.'],
['Art. 32, inciso I, alínea c','c) impossibilidade de as especificações técnicas serem definidas com precisão suficiente pela Administração;','A Administração não consegue traduzir a necessidade em especificações técnicas suficientemente precisas para uma licitação convencional. Essa impossibilidade deve ser real e demonstrada, não consequência de planejamento negligente.\n\nO diálogo serve justamente para identificar a solução; encerrado o diálogo, o edital da fase competitiva deverá conter especificação bastante para permitir propostas comparáveis.'],
['Art. 32, inciso II — caput','II - verifique a necessidade de definir e identificar os meios e as alternativas que possam satisfazer suas necessidades, com destaque para os seguintes aspectos:','Outra hipótese envolve a necessidade de descobrir os meios e alternativas adequados. A Administração sabe o resultado de que necessita, mas não domina completamente o caminho técnico, os requisitos ou a modelagem contratual.\n\nO mercado contribui durante o diálogo, sempre sob critérios objetivos, igualdade e proteção das informações de cada participante.'],
['Art. 32, inciso II, alínea a','a) a solução técnica mais adequada;','O diálogo pode comparar arquiteturas, métodos ou tecnologias para descobrir qual solução técnica atende melhor ao interesse público. A Administração não escolhe empresa nessa etapa; busca definir a solução.\n\nDepois, os licitantes pré-selecionados apresentam propostas na fase competitiva conforme os critérios divulgados.'],
['Art. 32, inciso II, alínea b','b) os requisitos técnicos aptos a concretizar a solução já definida;','Mesmo quando a solução geral já foi escolhida, podem faltar requisitos técnicos suficientes para torná-la executável, mensurável e fiscalizável. O diálogo ajuda a detalhar esses requisitos.\n\nA definição deve permitir comparação objetiva das propostas e posterior controle da execução contratual.'],
['Art. 32, inciso II, alínea c','c) a estrutura jurídica ou financeira do contrato;','A complexidade pode estar na modelagem jurídica ou financeira: divisão de riscos, forma de remuneração, garantias, financiamento, etapas ou responsabilidades contratuais. O diálogo permite testar alternativas antes da competição final.\n\nIsso não autoriza negociar sem limites. A estrutura escolhida deve respeitar a legislação, a isonomia e a proposta mais vantajosa.'],
['Art. 32, inciso III','III - (VETADO).','O inciso III não produz regra aplicável porque foi vetado. O texto permanece numerado para preservar a estrutura legislativa e registrar que a disposição aprovada pelo Legislativo não ingressou no ordenamento nessa parte.\n\nEm prova, não se presume o conteúdo vetado nem se atribui efeito jurídico a ele.'],
['Art. 32, § 1º — caput','§ 1º Na modalidade diálogo competitivo, serão observadas as seguintes disposições:','O parágrafo disciplina garantias e etapas obrigatórias do diálogo competitivo. Embora exista interação com o mercado, o procedimento continua formal, documentado, competitivo e submetido aos princípios licitatórios.\n\nOs incisos tratam de prazos, pré-seleção, sigilo, registros, encerramento do diálogo, propostas e comissão.'],
['Art. 32, § 1º, inciso I','I - a Administração apresentará, por ocasião da divulgação do edital em sítio eletrônico oficial, suas necessidades e as exigências já definidas e estabelecerá prazo mínimo de 25 (vinte e cinco) dias úteis para manifestação de interesse na participação da licitação;','O edital inicial informa a necessidade pública e tudo que já puder ser definido. A partir da divulgação oficial, os interessados dispõem de pelo menos 25 dias úteis para manifestar interesse.\n\nMemorize: 25 dias úteis para manifestação de interesse. O prazo é mínimo, podendo ser ampliado conforme a complexidade.'],
['Art. 32, § 1º, inciso II','II - os critérios empregados para pré-seleção dos licitantes deverão ser previstos em edital, e serão admitidos todos os interessados que preencherem os requisitos objetivos estabelecidos;','A pré-seleção não pode ocorrer por convite pessoal ou preferência subjetiva. Os critérios vêm no edital e todos que cumprirem os requisitos objetivos devem ser admitidos.\n\nA Administração pode exigir capacidade compatível com a complexidade, mas não limitar arbitrariamente o número de participantes aptos.'],
['Art. 32, § 1º, inciso III','III - a divulgação de informações de modo discriminatório que possa implicar vantagem para algum licitante será vedada;','Informação relevante não pode ser fornecida seletivamente de modo a beneficiar um concorrente. A igualdade informacional é indispensável para que todos disputem em condições equivalentes.\n\nEsclarecimentos gerais que afetem a competição devem ser comunicados de forma isonômica, sem antecipações privilegiadas.'],
['Art. 32, § 1º, inciso IV','IV - a Administração não poderá revelar a outros licitantes as soluções propostas ou as informações sigilosas comunicadas por um licitante sem o seu consentimento;','Cada participante pode apresentar conhecimento técnico, estratégia ou solução própria. A Administração deve preservar esse conteúdo e só poderá revelá-lo aos demais com consentimento do titular.\n\nA regra evita apropriação indevida e mantém confiança no diálogo. Ela convive com a publicidade do processo: informações protegidas recebem tratamento sigiloso justificado, enquanto os atos públicos continuam acessíveis.'],
['Art. 32, § 1º, inciso V','V - a fase de diálogo poderá ser mantida até que a Administração, em decisão fundamentada, identifique a solução ou as soluções que atendam às suas necessidades;','Não há número rígido de reuniões. O diálogo continua enquanto necessário para identificar solução adequada, mas o encerramento deve resultar de decisão fundamentada.\n\nA Administração precisa demonstrar por que a solução escolhida atende à necessidade, permitindo controle e evitando encerramento arbitrário.'],
['Art. 32, § 1º, inciso VI','VI - as reuniões com os licitantes pré-selecionados serão registradas em ata e gravadas mediante utilização de recursos tecnológicos de áudio e vídeo;','As reuniões exigem dupla documentação: ata e gravação em áudio e vídeo. Isso assegura memória do procedimento, transparência, controle e prova do tratamento dado aos participantes.\n\nPegadinha: não é suficiente fazer apenas ata ou apenas gravação. A lei usa “e”, exigindo ambos.'],
['Art. 32, § 1º, inciso VII','VII - o edital poderá prever a realização de fases sucessivas, caso em que cada fase poderá restringir as soluções ou as propostas a serem discutidas;','O diálogo pode avançar por etapas, eliminando ou restringindo alternativas conforme critérios previamente estruturados. Isso concentra a análise nas soluções progressivamente mais adequadas.\n\nA previsão deve constar do edital. Fases sucessivas não autorizam exclusões arbitrárias nem mudança casuística das regras.'],
['Art. 32, § 1º, inciso VIII','VIII - a Administração deverá, ao declarar que o diálogo foi concluído, juntar aos autos do processo licitatório os registros e as gravações da fase de diálogo, iniciar a fase competitiva com a divulgação de edital contendo a especificação da solução que atenda às suas necessidades e os critérios objetivos a serem utilizados para seleção da proposta mais vantajosa e abrir prazo, não inferior a 60 (sessenta) dias úteis, para todos os licitantes pré-selecionados na forma do inciso II deste parágrafo apresentarem suas propostas, que deverão conter os elementos necessários para a realização do projeto;','Encerrado o diálogo, os registros e gravações integram os autos. Um novo edital inicia a fase competitiva, especificando a solução e os critérios objetivos de seleção. Todos os pré-selecionados podem apresentar proposta.\n\nMemorize a diferença: mínimo de 25 dias úteis para manifestar interesse e mínimo de 60 dias úteis para apresentar propostas após o diálogo. A proposta deve conter os elementos necessários à realização do projeto.'],
['Art. 32, § 1º, inciso IX','IX - a Administração poderá solicitar esclarecimentos ou ajustes às propostas apresentadas, desde que não impliquem discriminação nem distorçam a concorrência entre as propostas;','Esclarecimentos e ajustes são permitidos para aperfeiçoar compreensão ou adequação, mas não podem transformar a proposta de um licitante de maneira privilegiada nem quebrar a comparação justa.\n\nO limite é a isonomia: não se pode usar o ajuste para corrigir seletivamente uma proposta substancial ou alterar a competição.'],
['Art. 32, § 1º, inciso X','X - a Administração definirá a proposta vencedora de acordo com critérios divulgados no início da fase competitiva, assegurada a contratação mais vantajosa como resultado;','A decisão final fica vinculada aos critérios previamente divulgados. A Administração não pode inventar novo critério depois de conhecer as propostas.\n\n“Mais vantajosa” não significa necessariamente menor preço isolado: envolve o resultado avaliado conforme critérios objetivos e a solução adequada ao interesse público.'],
['Art. 32, § 1º, inciso XI','XI - o diálogo competitivo será conduzido por comissão de contratação composta de pelo menos 3 (três) servidores efetivos ou empregados públicos pertencentes aos quadros permanentes da Administração, admitida a contratação de profissionais para assessoramento técnico da comissão;','A condução cabe a comissão com no mínimo três integrantes, todos servidores efetivos ou empregados públicos dos quadros permanentes. A complexidade justifica atuação colegiada e conhecimento institucional.\n\nProfissionais externos podem ser contratados para assessoramento técnico, mas não substituem a comissão nem assumem sua competência decisória.'],
['Art. 32, § 1º, inciso XII','XII - (VETADO).','Assim como o inciso III do caput, este dispositivo foi vetado e não contém comando jurídico vigente. Sua numeração permanece no texto consolidado por razão de técnica legislativa.\n\nNão confunda espaço vetado com autorização para regulamentação livre: simplesmente não há regra nesse inciso.'],
['Art. 32, § 2º','§ 2º Os profissionais contratados para os fins do inciso XI do § 1º deste artigo assinarão termo de confidencialidade e abster-se-ão de atividades que possam configurar conflito de interesses.','Os assessores técnicos externos terão acesso a soluções, segredos e informações estratégicas. Por isso, devem formalizar compromisso de confidencialidade e evitar atividades que gerem conflito entre o dever de auxiliar a Administração e interesses próprios ou de terceiros.\n\nAs duas cautelas são cumulativas: assinar o termo e abster-se de situações de conflito. A medida protege imparcialidade, sigilo e credibilidade do procedimento.']
];
const cards=document.getElementById('cards');
telas.forEach((t)=>{
  const texto=document.createElement('section');
  texto.className='card';
  texto.innerHTML=`<div class="tag">TEXTO INTEGRAL — ${t[0]}</div><div class="lei">${t[1]}</div><div class="dica">Leia todo o dispositivo. Na próxima tela, veja o comentário detalhado.</div>`;
  cards.appendChild(texto);
  const explicacao=document.createElement('section');
  explicacao.className='card';
  explicacao.innerHTML=`<div class="tag">EXPLICAÇÃO — ${t[0]}</div><div class="comentario"><strong>Comentário do Professor Moreira</strong><br><br>${t[2].replaceAll('\n','<br>')}<div class="dica">📌 <strong>Estude a literalidade:</strong> compare palavras como “deverá”, “poderá”, “vedada”, prazos e exceções.</div></div>`;
  cards.appendChild(explicacao);
});
let atual=0;const cs=[...document.querySelectorAll('.card')],prev=document.getElementById('prev'),next=document.getElementById('next'),counter=document.getElementById('counter'),bar=document.getElementById('bar');
function mostrar(n){atual=Math.max(0,Math.min(n,cs.length-1));cs.forEach((c,i)=>c.classList.toggle('active',i===atual));counter.textContent=`${atual+1} / ${cs.length}`;bar.style.width=`${(atual+1)/cs.length*100}%`;prev.disabled=atual===0;next.disabled=atual===cs.length-1;document.querySelector('main').scrollTop=0;window.scrollTo(0,0)}
prev.onclick=()=>mostrar(atual-1);next.onclick=()=>mostrar(atual+1);document.getElementById('restart').onclick=()=>mostrar(0);
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')mostrar(atual-1);if(e.key==='ArrowRight')mostrar(atual+1)});
let x=0;cards.addEventListener('touchstart',e=>x=e.changedTouches[0].screenX,{passive:true});cards.addEventListener('touchend',e=>{let d=e.changedTouches[0].screenX-x;if(Math.abs(d)>70)mostrar(atual+(d<0?1:-1))},{passive:true});mostrar(0);
</script>
</body>
</html>
